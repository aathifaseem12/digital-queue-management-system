spring.application.name=backend
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/queueless}
spring.datasource.username=${DB_USERNAME:queueless}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.enabled=true
server.servlet.session.timeout=30m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.secure=${COOKIE_SECURE:false}
app.frontend-origin=${FRONTEND_ORIGIN:http://localhost:5173}
server.error.include-message=always
